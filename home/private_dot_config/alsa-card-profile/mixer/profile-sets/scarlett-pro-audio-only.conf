; Profile set for the Focusrite Scarlett 4i4 4th Gen.
;
; Defines no analog/surround profiles, so the card only offers "Pro Audio" (and
; "Off"). This stops GNOME's output picker from switching the interface out of
; pro-audio, which would break the split in
; ~/.config/wireplumber/wireplumber.conf.d/60-scarlett-4i4-split.conf.
;
; Applied by ~/.config/wireplumber/wireplumber.conf.d/54-scarlett-pro-audio-only.conf

[General]
auto-profiles = no
