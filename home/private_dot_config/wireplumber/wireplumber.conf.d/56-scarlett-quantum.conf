# Run the Focusrite Scarlett 4i4 4th Gen at a 1024-sample quantum (21 ms at
# 48 kHz) whenever it drives the graph.
#
# Without this, PipeWire shrinks the quantum to the smallest latency any client
# asks for: TeamSpeak asks for 360 samples, so the whole graph ran at 256 (5 ms)
# and the Scarlett crackled under gaming load (xruns on the pro-input node).
# Forcing 1024 live with `pw-metadata -n settings 0 clock.force-quantum 1024`
# stopped the crackling instantly (2026-11-23), so this pins it per device.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_(input|output)\\.usb-Focusrite_Scarlett_4i4_4th_Gen.*" }
    ]
    actions = {
      update-props = {
        node.force-quantum = 1024
      }
    }
  }
]
