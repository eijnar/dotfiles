# Focusrite Scarlett 4i4 4th Gen (pro-audio profile), split into named devices,
# but only while it is plugged in. Managed by chezmoi (focusrite: true).
#
#   Outputs: Scarlett VoIP (1+2)        -> AUX0 AUX1
#            Scarlett HiFi (3+4)        -> AUX2 AUX3   (preferred default output)
#   Inputs:  Scarlett Front 1 (Mono)    <- AUX0        (preferred default input)
#
# "Preferred default": priority.session 3000 beats the card's raw pro-audio
# nodes (the 6-channel pro-input-0 has 2600) and the built-in sound cards.
#            Scarlett Front 2 (Mono)    <- AUX1
#            Scarlett Back 3+4 (Stereo) <- AUX2 AUX3
#
# ~/.local/share/wireplumber/scripts/scarlett-4i4-split.lua (WirePlumber 0.5 only
# looks for scripts there, not in ~/.config) creates one loopback per
# entry below when the card's pro-audio output or input node appears, with
# @TARGET@ replaced by that node's name, and removes them when the node goes
# away. Unplugged, none of these devices exist, so nothing points at a missing
# card.
#
# Notes on the stream props:
# - node.dont-fallback + node.linger: if the card's node vanishes before the
#   script removes the loopback, the stream waits unlinked instead of jumping
#   to another device (with dont-fallback alone WirePlumber destroys it).
# - application.id on the input streams: GNOME Shell's mic indicator ignores
#   recording streams from org.PulseAudio.pavucontrol, so the icon only shows
#   when a real application records. (pavucontrol's Recording tab hides them.)

# Optional features only load when something asks for them, so a required
# virtual feature "wants" the script: it loads if it can, and if it ever fails,
# WirePlumber still starts (which "required" on the script itself wouldn't).
# The hooks.* name makes WirePlumber load it before the standard event source,
# so the script sees the card's nodes appear even when it's plugged in at boot.
wireplumber.components = [
  {
    name = scarlett-4i4-split.lua, type = script/lua
    provides = hooks.custom.scarlett-4i4-split
  }
  {
    type = virtual, provides = custom.dotfiles
    wants = [ hooks.custom.scarlett-4i4-split ]
  }
]

wireplumber.profiles = {
  main = {
    custom.dotfiles = required
  }
}

scarlett-4i4.split = {
  # Lua patterns for the card's pro-audio nodes (any 4i4 4th Gen, any serial)
  output-node = "^alsa_output%.usb%-Focusrite_Scarlett_4i4_4th_Gen.*%.pro%-output%-0$"
  input-node = "^alsa_input%.usb%-Focusrite_Scarlett_4i4_4th_Gen.*%.pro%-input%-0$"

  loopbacks = [
    # ------------------------------------------------------------- outputs
    {
      attach = output
      args = {
        capture.props = {
          node.name = "scarlett_voip"
          node.description = "Scarlett VoIP (1+2)"
          media.class = "Audio/Sink"
          audio.position = [ FL FR ]
        }
        playback.props = {
          node.name = "scarlett_voip.playback"
          node.description = "Scarlett VoIP (1+2) output"
          target.object = "@TARGET@"
          audio.position = [ AUX0 AUX1 ]
          stream.dont-remix = true
          node.passive = true
          node.dont-fallback = true
          node.linger = true
        }
      }
    }
    {
      attach = output
      args = {
        capture.props = {
          node.name = "scarlett_hifi"
          node.description = "Scarlett HiFi (3+4)"
          media.class = "Audio/Sink"
          audio.position = [ FL FR ]
          priority.session = 3000
        }
        playback.props = {
          node.name = "scarlett_hifi.playback"
          node.description = "Scarlett HiFi (3+4) output"
          target.object = "@TARGET@"
          audio.position = [ AUX2 AUX3 ]
          stream.dont-remix = true
          node.passive = true
          node.dont-fallback = true
          node.linger = true
        }
      }
    }
    # -------------------------------------------------------------- inputs
    {
      attach = input
      args = {
        capture.props = {
          node.name = "scarlett_front_1.capture"
          node.description = "Scarlett Front 1 (Mono) input"
          target.object = "@TARGET@"
          audio.position = [ AUX0 ]
          stream.dont-remix = true
          node.passive = true
          node.dont-fallback = true
          node.linger = true
          application.id = "org.PulseAudio.pavucontrol"
          application.name = "Scarlett input split"
        }
        playback.props = {
          node.name = "scarlett_front_1"
          node.description = "Scarlett Front 1 (Mono)"
          media.class = "Audio/Source"
          audio.position = [ MONO ]
          priority.session = 3000
        }
      }
    }
    {
      attach = input
      args = {
        capture.props = {
          node.name = "scarlett_front_2.capture"
          node.description = "Scarlett Front 2 (Mono) input"
          target.object = "@TARGET@"
          audio.position = [ AUX1 ]
          stream.dont-remix = true
          node.passive = true
          node.dont-fallback = true
          node.linger = true
          application.id = "org.PulseAudio.pavucontrol"
          application.name = "Scarlett input split"
        }
        playback.props = {
          node.name = "scarlett_front_2"
          node.description = "Scarlett Front 2 (Mono)"
          media.class = "Audio/Source"
          audio.position = [ MONO ]
        }
      }
    }
    {
      attach = input
      args = {
        capture.props = {
          node.name = "scarlett_back_3_4.capture"
          node.description = "Scarlett Back 3+4 (Stereo) input"
          target.object = "@TARGET@"
          audio.position = [ AUX2 AUX3 ]
          stream.dont-remix = true
          node.passive = true
          node.dont-fallback = true
          node.linger = true
          application.id = "org.PulseAudio.pavucontrol"
          application.name = "Scarlett input split"
        }
        playback.props = {
          node.name = "scarlett_back_3_4"
          node.description = "Scarlett Back 3+4 (Stereo)"
          media.class = "Audio/Source"
          audio.position = [ FL FR ]
        }
      }
    }
  ]
}
