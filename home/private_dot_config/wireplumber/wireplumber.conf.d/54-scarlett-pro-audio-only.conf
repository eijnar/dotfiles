# Lock the Focusrite Scarlett 4i4 4th Gen to the pro-audio profile by giving it a
# profile set with no other profiles
# (~/.config/alsa-card-profile/mixer/profile-sets/scarlett-pro-audio-only.conf).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-Focusrite_Scarlett_4i4_4th_Gen_S46TRBE520CD60-00" }
    ]
    actions = {
      update-props = {
        device.profile-set = "scarlett-pro-audio-only.conf"
      }
    }
  }
]
