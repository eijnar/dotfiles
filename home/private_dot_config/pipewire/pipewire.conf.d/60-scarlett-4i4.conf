# Focusrite Scarlett 4i4 4th Gen (pro-audio profile) split into named devices.
#
# Managed by chezmoi (github.com/eijnar/dotfiles), on machines with focusrite: true.
# Replaces the old ~/.local/bin/pipewire-remaps.sh + pipewire-remaps.service.
#
#   Outputs: Scarlett VoIP (1+2)        -> AUX0 AUX1
#            Scarlett HiFi (3+4)        -> AUX2 AUX3   (default sink)
#   Inputs:  Scarlett Front 1 (Mono)    <- AUX0        (default source)
#            Scarlett Front 2 (Mono)    <- AUX1
#            Scarlett Back 3+4 (Stereo) <- AUX2 AUX3
#
# Notes:
# - node.dont-fallback + node.linger: if the Focusrite is off/unplugged, the split
#   streams wait unlinked instead of falling back to other devices (or to each
#   other). Both are needed: with dont-fallback alone WirePlumber 0.5 destroys the
#   stream when the target is missing, which makes module-loopback unload itself
#   (see /usr/share/wireplumber/scripts/linking/find-defined-target.lua).
# - application.id on the input capture streams: GNOME Shell's mic indicator
#   (js/ui/status/volume.js, InputIndicator._maybeShowInput) ignores recording
#   streams from org.gnome.VolumeControl / org.PulseAudio.pavucontrol. Tagging the
#   internal split streams this way means the yellow mic icon only shows when a
#   real application records. Side effect: pavucontrol's Recording tab hides them.

context.modules = [

  # ---------------------------------------------------------------- outputs

  { name = libpipewire-module-loopback
    args = {
      capture.props = {
        node.name        = "scarlett_voip"
        node.description = "Scarlett VoIP (1+2)"
        media.class      = "Audio/Sink"
        audio.position   = [ FL FR ]
      }
      playback.props = {
        node.name          = "scarlett_voip.playback"
        node.description   = "Scarlett VoIP (1+2) output"
        target.object      = "alsa_output.usb-Focusrite_Scarlett_4i4_4th_Gen_S46TRBE520CD60-00.pro-output-0"
        audio.position     = [ AUX0 AUX1 ]
        stream.dont-remix  = true
        node.passive       = true
        node.dont-fallback = true
        node.linger        = true
      }
    }
  }

  { name = libpipewire-module-loopback
    args = {
      capture.props = {
        node.name        = "scarlett_hifi"
        node.description = "Scarlett HiFi (3+4)"
        media.class      = "Audio/Sink"
        audio.position   = [ FL FR ]
        priority.session = 2000
      }
      playback.props = {
        node.name          = "scarlett_hifi.playback"
        node.description   = "Scarlett HiFi (3+4) output"
        target.object      = "alsa_output.usb-Focusrite_Scarlett_4i4_4th_Gen_S46TRBE520CD60-00.pro-output-0"
        audio.position     = [ AUX2 AUX3 ]
        stream.dont-remix  = true
        node.passive       = true
        node.dont-fallback = true
        node.linger        = true
      }
    }
  }

  # ----------------------------------------------------------------- inputs

  { name = libpipewire-module-loopback
    args = {
      capture.props = {
        node.name          = "scarlett_front_1.capture"
        node.description   = "Scarlett Front 1 (Mono) input"
        target.object      = "alsa_input.usb-Focusrite_Scarlett_4i4_4th_Gen_S46TRBE520CD60-00.pro-input-0"
        audio.position     = [ AUX0 ]
        stream.dont-remix  = true
        node.passive       = true
        node.dont-fallback = true
        node.linger        = true
        application.id     = "org.PulseAudio.pavucontrol"
        application.name   = "Scarlett input split"
      }
      playback.props = {
        node.name        = "scarlett_front_1"
        node.description = "Scarlett Front 1 (Mono)"
        media.class      = "Audio/Source"
        audio.position   = [ MONO ]
        priority.session = 2000
      }
    }
  }

  { name = libpipewire-module-loopback
    args = {
      capture.props = {
        node.name          = "scarlett_front_2.capture"
        node.description   = "Scarlett Front 2 (Mono) input"
        target.object      = "alsa_input.usb-Focusrite_Scarlett_4i4_4th_Gen_S46TRBE520CD60-00.pro-input-0"
        audio.position     = [ AUX1 ]
        stream.dont-remix  = true
        node.passive       = true
        node.dont-fallback = true
        node.linger        = true
        application.id     = "org.PulseAudio.pavucontrol"
        application.name   = "Scarlett input split"
      }
      playback.props = {
        node.name        = "scarlett_front_2"
        node.description = "Scarlett Front 2 (Mono)"
        media.class      = "Audio/Source"
        audio.position   = [ MONO ]
      }
    }
  }

  { name = libpipewire-module-loopback
    args = {
      capture.props = {
        node.name          = "scarlett_back_3_4.capture"
        node.description   = "Scarlett Back 3+4 (Stereo) input"
        target.object      = "alsa_input.usb-Focusrite_Scarlett_4i4_4th_Gen_S46TRBE520CD60-00.pro-input-0"
        audio.position     = [ AUX2 AUX3 ]
        stream.dont-remix  = true
        node.passive       = true
        node.dont-fallback = true
        node.linger        = true
        application.id     = "org.PulseAudio.pavucontrol"
        application.name   = "Scarlett input split"
      }
      playback.props = {
        node.name        = "scarlett_back_3_4"
        node.description = "Scarlett Back 3+4 (Stereo)"
        media.class      = "Audio/Source"
        audio.position   = [ FL FR ]
      }
    }
  }
]
