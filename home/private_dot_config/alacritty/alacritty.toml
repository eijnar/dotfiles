# ~/.config/alacritty/alacritty.toml — managed by chezmoi (github.com/eijnar/dotfiles).
# Edit with `chezmoi edit ~/.config/alacritty/alacritty.toml`; Alacritty
# reloads it live (window decorations only change in new windows).

[window]
# Just the terminal: no title bar or border. In GNOME, move the window with
# Super+drag, resize it with Super+middle-drag (or Alt+F8), maximize with
# Super+Up.
decorations = "None"
padding = { x = 10, y = 8 }
# Spread the pixels left over after fitting whole cells evenly around the text.
dynamic_padding = true

[font]
# The Nerd Font variant, so starship's and tmux's icons come from the same font
# (package ttf-hack-nerd). "Hack Nerd Font Mono" squeezes icons into one cell.
normal = { family = "Hack Nerd Font", style = "Regular" }
bold = { family = "Hack Nerd Font", style = "Bold" }
italic = { family = "Hack Nerd Font", style = "Italic" }
bold_italic = { family = "Hack Nerd Font", style = "Bold Italic" }

[scrolling]
history = 50000

[mouse]
hide_when_typing = true

# Nord, matching the nord themes used by tmux and vim.
[colors.primary]
background = "#2e3440"
foreground = "#d8dee9"
dim_foreground = "#a5abb6"

[colors.cursor]
text = "#2e3440"
cursor = "#d8dee9"

[colors.vi_mode_cursor]
text = "#2e3440"
cursor = "#d8dee9"

[colors.selection]
text = "CellForeground"
background = "#4c566a"

[colors.search.matches]
foreground = "CellBackground"
background = "#88c0d0"

[colors.normal]
black = "#3b4252"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
magenta = "#b48ead"
cyan = "#88c0d0"
white = "#e5e9f0"

[colors.bright]
black = "#4c566a"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
magenta = "#b48ead"
cyan = "#8fbcbb"
white = "#eceff4"

[colors.dim]
black = "#373e4d"
red = "#94545d"
green = "#809575"
yellow = "#b29e75"
blue = "#68809a"
magenta = "#8c738c"
cyan = "#6d96a5"
white = "#aeb3bb"

# Shift+Enter sends ESC + Enter: a newline without submitting, in apps like
# Claude Code.
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
