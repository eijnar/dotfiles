# Arch packages installed by .chezmoiscripts/run_onchange_before_10-install-packages.sh.
# `base` goes on every machine; the others follow the flags in machines.yaml.
packages:
  base:
    - chezmoi
    - fastfetch
    - fzf
    - git
    - github-cli        # git credential helper, jaktkollen
    - less              # git's pager; not part of Arch's base
    - openssh
    - starship
    - tmux
    - vim
    - zsh
    - zsh-autosuggestions
    - zsh-completions
    - zsh-syntax-highlighting
  morbit:              # home machines (machines.yaml: morbit)
    - bitwarden-cli     # bw
    - libfido2          # fido2-token, FIDO2 SSH keys
    - yubikey-manager   # ykman
    - ccid              # smart-card side of the YubiKey (OATH, PIV, OpenPGP),
    - pcsclite          # through pcscd: .chezmoiscripts/..-enable-pcscd
  desktop:
    - alacritty
    - ttf-hack-nerd     # Nerd Font symbols for starship and tmux
  whitelight:
    - gtk3
    - python-gobject
  github_yubikey:
    - libfido2          # FIDO2 SSH keys (ed25519-sk); only optional for openssh
    - yubikey-manager   # ykman
  yubikey_login:
    - libpam-google-authenticator  # TOTP code after the password
    - pam-u2f           # YubiKey login
    - qrencode          # QR code for the authenticator app
  focusrite:
    - pipewire
    - pipewire-pulse
    - wireplumber
